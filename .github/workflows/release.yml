name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64 (GNU)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: lorapress
            asset_name: lorapress-x86_64-unknown-linux-gnu.tar.gz
            archive_cmd: tar -czf lorapress-x86_64-unknown-linux-gnu.tar.gz -C target/x86_64-unknown-linux-gnu/release lorapress
          # Linux ARM64 (aarch64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: lorapress
            asset_name: lorapress-aarch64-unknown-linux-gnu.tar.gz
            cross: true
            archive_cmd: tar -czf lorapress-aarch64-unknown-linux-gnu.tar.gz -C target/aarch64-unknown-linux-gnu/release lorapress
          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: lorapress
            asset_name: lorapress-aarch64-apple-darwin.tar.gz
            archive_cmd: tar -czf lorapress-aarch64-apple-darwin.tar.gz -C target/aarch64-apple-darwin/release lorapress
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: lorapress.exe
            asset_name: lorapress-x86_64-pc-windows-msvc.zip
            archive_cmd: 7z a lorapress-x86_64-pc-windows-msvc.zip ./target/x86_64-pc-windows-msvc/release/lorapress.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (for cross-compilation if needed)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build CLI
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p lorapress-cli
          else
            cargo build --release --target ${{ matrix.target }} -p lorapress-cli
          fi
        shell: bash

      - name: Package binary archive
        run: ${{ matrix.archive_cmd }}
        shell: bash

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
